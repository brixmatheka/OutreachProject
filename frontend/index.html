<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    (() => {
      try {
        const preferences = JSON.parse(localStorage.getItem("memberPreferences") || "{}");
        document.documentElement.dataset.memberTheme = preferences.theme || "dark";
        document.documentElement.dataset.memberTextSize = preferences.textSize || "comfortable";
        document.documentElement.dataset.reduceMotion = preferences.reducedMotion ? "true" : "false";
      } catch {
        document.documentElement.dataset.memberTheme = "dark";
      }
    })();
  </script>
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <meta name="description"
    content="Outreach Hope Church Sunshine — a Christ-centered community where the Word is preached and love is experienced." />
  <meta property="og:title" content="Outreach Hope Church Sunshine" />
  <meta property="og:description"
    content="Join our services, events, prayer community, sermons, and outreach ministries." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/logo.png" />
  <title>Outreach Hope Church Sunshine</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
